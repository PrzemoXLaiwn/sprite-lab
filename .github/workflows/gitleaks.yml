name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan new commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The parent commit has to be present so git can build the range.
          # The gitleaks command below still scans only that range.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o "$archive" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits only
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Commits on the PR, and nothing already on the base branch.
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -z "${BEFORE_SHA}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${BEFORE_SHA}..${PUSH_SHA}"
          fi
          echo "Scanning git range: ${range}"
          # Official binary, not gitleaks-action: the action needs a license on
          # organization accounts, and its push path only sees the 20 commits
          # GitHub puts on the event. --log-opts limits git log to this range,
          # so existing history is not scanned and is not rewritten.
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="${range}"
